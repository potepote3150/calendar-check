<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>カレンダーチェック（クラウド同期）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  --bg-body: #f3f4f6;
  --bg-app: #ffffff;
  --bg-card: #ffffff;
  --border-card: #e5e7eb;
  --text-main: #111827;
  --text-muted: #6b7280;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --shadow-soft: 0 10px 25px rgba(15, 23, 42, 0.12);
  --radius-lg: 18px;

  --nav-btn-bg: #eff6ff;
  --nav-btn-text: #1d4ed8;
  --nav-btn-border: #bfdbfe;
  --nav-btn-bg-hover: #e0edff;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg-body);
  color: var(--text-main);
  -webkit-user-select: none;
  user-select: none;
}

input,
select,
button,
textarea {
  -webkit-user-select: auto;
  user-select: auto;
}

/* ===== テーマ切り替え時のアニメーション ===== */
body,
.app,
.calendar-card,
.login-panel,
.subview,
.day,
.settings-menu,
.mark-menu,
#monthLabel {
  transition:
    background-color 0.25s ease,
    color 0.25s ease,
    border-color 0.25s ease,
    box-shadow 0.25s ease;
}

.app {
  position: relative;
  max-width: 960px;
  margin: 24px auto 40px;
  padding: 16px;
}

/* ログインパネル */
.login-panel {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: 14px 16px 12px;
  border: 1px solid var(--border-card);
  margin-top: 48px;
}

.login-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.login-panel-header h2 {
  margin: 0;
  font-size: 1rem;
}

.login-toggle-btn {
  border: none;
  background: transparent;
  font-size: 1rem;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 9999px;
  color: var(--text-muted);
}

.login-form {
  display: block;
  margin-top: 4px;
}

.login-inputs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.login-inputs label {
  font-size: 0.8rem;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.login-inputs input {
  padding: 6px 8px;
  border-radius: 9999px;
  border: 1px solid #d1d5db;
  font-size: 0.85rem;
  min-width: 140px;
}

.login-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.login-buttons button {
  flex: 0 0 auto;
}

.login-status {
  margin: 6px 2px 0;
  font-size: 0.78rem;
  color: var(--text-muted);
}

/* 設定ボタン & メニュー */
.settings-btn {
  position: fixed;
  top: 14px;
  right: max(12px, calc(50% - 480px + 12px));
  z-index: 40;
  width: 34px;
  height: 34px;
  border-radius: 9999px;
  border: none;
  background: #111827;
  color: #f9fafb;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.35);
  cursor: pointer;
}

.settings-btn span {
  font-size: 18px;
}

.settings-menu {
  position: fixed;
  top: 58px;
  right: max(12px, calc(50% - 480px + 12px));
  z-index: 39;
  background: #ffffff;
  border-radius: 16px;
  border: 1px solid #e5e7eb;
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
  padding: 10px 12px;
  width: 220px;
  display: none;
}

.settings-menu .settings-title {
  margin: 0 0 6px;
  font-size: 0.85rem;
  font-weight: 600;
}

.settings-section {
  margin-bottom: 8px;
}

.settings-section:last-child {
  margin-bottom: 0;
}

.settings-menu button {
  width: 100%;
  padding: 6px 8px;
  margin-top: 4px;
  border-radius: 9999px;
  border: none;
  font-size: 0.82rem;
  text-align: left;
  cursor: pointer;
  background: #f3f4f6;
  color: #111827;
}

.settings-menu button:hover {
  background: #e5e7eb;
}

.settings-menu button.danger {
  background: #fee2e2;
  color: #b91c1c;
}

.settings-menu button.danger:hover {
  background: #fecaca;
}

/* カレンダーカード */
#mainView {
  margin-top: 16px;
}

.calendar-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: 14px 16px 16px;
  border: 1px solid var(--border-card);
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.calendar-header h2 {
  margin: 0;
  font-size: 1rem;
}

.calendar-tools {
  margin-top: 4px;
}

.calendar-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

.nav-btn,
.today-btn {
  border-radius: 9999px;
  border: 1px solid var(--nav-btn-border);
  background: var(--nav-btn-bg);
  color: var(--nav-btn-text);
  font-size: 0.85rem;
  padding: 4px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.06s ease, box-shadow 0.1s ease;
  box-shadow: 0 1px 0 rgba(15, 23, 42, 0.12);
}

.nav-btn:active,
.today-btn:active {
  transform: translateY(1px);
  box-shadow: 0 0 0 rgba(15, 23, 42, 0.1);
}

.nav-btn:hover,
.today-btn:hover {
  background: var(--nav-btn-bg-hover);
}

#monthLabel {
  flex: 1 1 auto;
  max-width: 220px;
  text-align: center;
  border-radius: 9999px;
  border: 1px solid #e5e7eb;
  padding: 4px 10px;
  font-size: 0.9rem;
  background: #f9fafb;
  cursor: pointer;
}

.today-btn {
  margin-left: auto;
  font-size: 0.8rem;
  padding-inline: 10px;
}

.today-btn.today-active {
  border-color: #f97316;
  background: #fff7ed;
  color: #c2410c;
}

/* モード切り替え（マーク / メモ） */
.mode-switch {
  margin-top: 0;
  margin-bottom: 6px;
  display: flex;
  justify-content: flex-end;
  gap: 4px;
  flex-wrap: wrap;
}

.mode-btn {
  border-radius: 9999px;
  border: 1px solid var(--nav-btn-border);
  background: var(--nav-btn-bg);
  color: var(--nav-btn-text);
  font-size: 0.78rem;
  padding: 3px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.06s ease, box-shadow 0.1s ease;
  box-shadow: 0 1px 0 rgba(15, 23, 42, 0.12);
}

.mode-btn:active {
  transform: translateY(1px);
  box-shadow: 0 0 0 rgba(15, 23, 42, 0.1);
}

.mode-btn:hover {
  background: var(--nav-btn-bg-hover);
}

.mode-btn.active {
  background: var(--nav-btn-bg-hover);
  border-color: #2563eb;
  color: #1d4ed8;
  box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.3);
  font-weight: 600;
}

/* 月ラベル（手帳テーマ用のベース） */
body.theme-notebook #monthLabel {
  position: relative;
  background: #fef9c3;
  border-color: #fbbf24;
  transform: translateY(1px) rotate(-0.3deg);
}

body.theme-notebook #monthLabel::before,
body.theme-notebook #monthLabel::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
}

body.theme-notebook #monthLabel::before {
  border-bottom: 1px dashed rgba(0, 0, 0, 0.1);
  transform: translateY(1px);
}

body.theme-notebook #monthLabel::after {
  content: "メモ";
  position: absolute;
  left: 8px;
  top: -10px;
  font-size: 0.6rem;
  color: #9ca3af;
}

/* カレンダーグリッド */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  font-size: 0.78rem;
}

.dow {
  text-align: center;
  font-weight: 600;
  padding: 4px 0;
  color: var(--text-muted);
}

.dow.sun {
  color: #b91c1c;
}
.dow.sat {
  color: #1d4ed8;
}

.day {
  position: relative;
  min-height: 52px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  padding: 3px 4px 2px;
  cursor: pointer;
  transition: background 0.12s ease, transform 0.08s ease, box-shadow 0.12s ease, border-color 0.15s ease;
  box-shadow: 0 1px 0 rgba(15, 23, 42, 0.06);
}

.day.empty {
  visibility: hidden;
  pointer-events: none;
}

.day:hover {
  background: #f9fafb;
}

.day:active {
  transform: translateY(1px);
  box-shadow: none;
}

.day-number {
  font-size: 0.8rem;
  font-weight: 600;
  color: #111827;
}

/* 土日・祝日の日付色 */
.day.sun .day-number,
.day.holiday .day-number {
  color: #f97373;
}
.day.sat .day-number {
  color: #60a5fa;
}

.day.today {
  border-color: #f97316;
  box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.4);
}

.day.has-mark {
  border-color: #22c55e;
  box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.4);
}

.day.selected {
  box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.6);
  border-color: #2563eb;
}

/* 祝日名ラベル */
.holiday-label {
  font-size: 0.6rem;
  color: #f97373;
  margin-top: 1px;
  line-height: 1.1;
  text-align: center;
}

/* メモありインジケーター（📝） */
.memo-indicator {
  position: absolute;
  right: 3px;
  bottom: 2px;
  font-size: 0.7rem;
  opacity: 0.9;
  pointer-events: none;
}

/* マークアイコン */
.mark-icon {
  margin-top: auto;
  font-size: 1rem;
  text-align: center;
}

/* 凡例 & 選択中情報 */
.mark-legend {
  margin-top: 8px;
  display: none;
  gap: 6px;
  flex-wrap: wrap;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 9999px;
  background: #f3f4f6;
  font-size: 0.7rem;
}

.legend-icon {
  font-size: 0.9rem;
}

.selected-info {
  display: none;
  margin-top: 6px;
  font-size: 0.8rem;
  color: #111827;
  padding: 4px 8px;
  border-radius: 9999px;
  background: #eff6ff;
}

/* メモエリア */
.memo-container {
  display: none;
  margin-top: 6px;
  padding: 8px 10px;
  border-radius: 12px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  font-size: 0.8rem;
}

.memo-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  font-size: 0.78rem;
  color: #4b5563;
}

#memoTextarea {
  width: 100%;
  min-height: 60px;
  resize: vertical;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  padding: 6px 8px;
  font-size: 0.8rem;
  box-sizing: border-box;
}

.memo-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 6px;
}

.memo-buttons button {
  font-size: 0.8rem;
  border-radius: 9999px;
  padding: 4px 10px;
  border: none;
  cursor: pointer;
}

.memo-hint {
  margin-top: 4px;
  font-size: 0.7rem;
}

/* サブビュー共通 */
.subview {
  margin-top: 16px;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: 14px 16px 16px;
  border: 1px solid var(--border-card);
}

.subview h2 {
  margin-top: 0;
  font-size: 1rem;
}

.form-group {
  margin-bottom: 10px;
}

.form-group label {
  font-size: 0.85rem;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.form-group input,
.form-group select {
  padding: 7px 9px;
  border-radius: 9999px;
  border: 1px solid #d1d5db;
  font-size: 0.85rem;
}

.panel-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px;
}

/* 汎用ボタン */
button {
  font-family: inherit;
}

button.primary {
  background: #2563eb;
  color: #ffffff;
}

button.danger {
  background: #ef4444;
  color: #ffffff;
}

button.danger-outline {
  border: 1px solid #ef4444;
  color: #b91c1c;
  background: #fef2f2;
}

button:disabled {
  opacity: 0.6;
  cursor: default;
}

/* マーク設定 */
.mark-settings-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr);
  gap: 12px;
  margin-top: 4px;
}

.mark-settings-main h3,
.mark-settings-subs h3,
.mark-new h3,
.mark-list-section h3 {
  margin: 6px 0;
  font-size: 0.9rem;
}

.mark-settings-main select {
  width: 100%;
}

.submark-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px 8px;
}

.submark-list label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.8rem;
}

.submark-list select {
  min-width: 90px;
}

.mark-new-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-end;
}

.mark-new-row label {
  font-size: 0.8rem;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.mark-new-row input[type="text"] {
  padding: 6px 8px;
  border-radius: 9999px;
  border: 1px solid #d1d5db;
  font-size: 0.85rem;
}

.mark-new-row input[type="color"] {
  width: 46px;
  height: 32px;
  padding: 0;
  border-radius: 9999px;
  border: 1px solid #d1d5db;
}

.mark-new-row button {
  padding: 6px 10px;
  border-radius: 9999px;
  border: none;
  background: #22c55e;
  color: #ffffff;
  font-size: 0.85rem;
}

.unused-marks {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}

.unused-mark-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 9999px;
  background: #f3f4f6;
  font-size: 0.75rem;
}

.unused-mark-item input[type="checkbox"] {
  margin: 0;
}

.unused-mark-icon {
  font-size: 0.9rem;
}

.hint {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* アカウント削除などの警告文 */
.warning-text {
  font-size: 0.8rem;
  color: #b91c1c;
  background: #fef2f2;
  border-radius: 8px;
  padding: 6px 8px;
}

/* マークメニュー */
.mark-menu {
  position: absolute;
  z-index: 50;
  display: none;
  flex-direction: column;
  min-width: 180px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
  background: #ffffff;
  box-shadow: 0 18px 45px rgba(15, 23, 42, 0.45);
  padding: 6px;
}

.mark-menu button {
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  width: 100%;
  padding: 6px 8px;
  border-radius: 9999px;
  cursor: pointer;
  font-size: 0.82rem;
}

.mark-menu button:hover {
  background: #eff6ff;
}

.mark-menu .icon {
  font-size: 1rem;
}

/* 月選択オーバーレイ */
.month-picker-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 45;
  backdrop-filter: blur(4px);
}

.month-picker-panel {
  background: #ffffff;
  border-radius: 16px;
  border: 1px solid #e5e7eb;
  box-shadow: 0 18px 45px rgba(15, 23, 42, 0.5);
  padding: 12px 14px 10px;
  width: min(320px, 90vw);
}

.month-picker-panel h3 {
  margin-top: 0;
  margin-bottom: 8px;
  font-size: 0.95rem;
}

.month-picker-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.month-picker-row select {
  flex: 1 1 50%;
  padding: 6px 8px;
  border-radius: 9999px;
  border: 1px solid #d1d5db;
  font-size: 0.9rem;
}

.month-picker-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* アニメーション */
@keyframes slide-left {
  from { transform: translateX(12px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slide-right {
  from { transform: translateX(-12px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes fade-calendar {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

.calendar-grid.anim-left {
  animation: slide-left 0.16s ease-out;
}
.calendar-grid.anim-right {
  animation: slide-right 0.16s ease-out;
}
.calendar-grid.anim-fade {
  animation: fade-calendar 0.18s ease-out;
}

/* テーマ：手帳 */
body.theme-notebook {
  --bg-body: #fef9c3;
  --bg-app: transparent;
  --bg-card: #fffef6;
  --border-card: #fbbf24;
}

body.theme-notebook .app {
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(185, 185, 185, 0.08),
      rgba(185, 185, 185, 0.08) 28px,
      rgba(255, 255, 255, 0.2) 28px,
      rgba(255, 255, 255, 0.2) 30px
    );
  border-radius: 24px;
  padding: 20px 18px 18px;
  box-shadow:
    0 18px 45px rgba(148, 93, 30, 0.35),
    inset 0 0 0 1px rgba(250, 204, 21, 0.5);
  border: 1px solid rgba(250, 204, 21, 0.8);
}

/* 手帳の綴じリング */
body.theme-notebook .app::after {
  content: "";
  position: absolute;
  top: -10px;
  left: 18%;
  right: 18%;
  height: 18px;
  background:
    radial-gradient(circle at 0% 0%, rgba(15, 23, 42, 0.24) 0, rgba(15, 23, 42, 0.24) 3px, transparent 3px) 0 8px / 32px 18px repeat-x,
    radial-gradient(circle at 100% 0%, rgba(15, 23, 42, 0.24) 0, rgba(15, 23, 42, 0.24) 3px, transparent 3px) 16px 8px / 32px 18px repeat-x;
  opacity: 0.9;
}

/* 赤い罫線はメインビューだけ */
body.theme-notebook #mainView {
  position: relative;
}

/* テーマ：ダーク */
body.theme-dark {
  --bg-body: #020617;
  --bg-app: transparent;
  --bg-card: #020617;
  --border-card: #1e293b;

  --nav-btn-bg: #020617;
  --nav-btn-text: #e5e7eb;
  --nav-btn-border: #1e293b;
  --nav-btn-bg-hover: #020617;
}

body.theme-dark {
  color: #e5e7eb;
}

body.theme-dark .calendar-card,
body.theme-dark .login-panel,
body.theme-dark .subview {
  background: radial-gradient(circle at top left, #0b1120 0, #020617 55%);
  border-color: #1f2937;
  box-shadow:
    0 0 0 1px rgba(15, 23, 42, 0.9),
    0 18px 45px rgba(0, 0, 0, 0.85);
}

body.theme-dark .login-status {
  color: #9ca3af;
}

body.theme-dark .login-inputs input,
body.theme-dark .form-group input,
body.theme-dark .form-group select {
  background: #020617;
  border-color: #111827;
  color: #e5e7eb;
}

body.theme-dark #monthLabel {
  background: #020617;
  border-color: #1e293b;
  color: #e5e7eb;
}

body.theme-dark .calendar-grid .day {
  background: #020617;
  border-color: #020617;
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.8);
}

body.theme-dark .calendar-grid .day:hover {
  background: #020617;
}

body.theme-dark .calendar-grid .day-number {
  color: #e5e7eb;
}

body.theme-dark .calendar-grid .day.sun .day-number,

// ===== アプリ用状態 =====
let marks = {};                // "yyyy-mm-dd" -> markId

// ===== トースト通知 =====
function showToast(message, duration = 2200) {
  const el = document.getElementById("toast");
  if (!el) {
    alert(message);
    return;
  }
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => {
    el.classList.remove("show");
  }, duration);
}

function showLoginRequiredHint() {
  if (!loginHintShown) {
    showToast("先にログインしてください");
    loginHintShown = true;
  }
}

// ===== テーマ適用 =====
function applyTheme() {
  const bodyEl = document.body;
  if (!bodyEl) return;
  bodyEl.classList.remove("theme-light", "theme-notebook", "theme-dark");
  let cls = "theme-light";
  if (currentTheme === "notebook") cls = "theme-notebook";
  else if (currentTheme === "dark") cls = "theme-dark";
  bodyEl.classList.add(cls);
}

// ===== デフォルトマーク定義 =====
function getDefaultMarkSetup() {
  const defs = {
    m1: { icon: "✓", color: "#16a34a" },
    m2: { icon: "○", color: "#ef4444" },
    m3: { icon: "◎", color: "#f97316" }
  };
  const mainId = "m1";
  const subs = { "1": "m2", "2": "m3" };
  return { defs, mainId, subs };
}

// ===== 画面切り替え =====
function showView(name) {
  const mainView = document.getElementById("mainView");
  const changeView = document.getElementById("changeView");
  const deleteView = document.getElementById("deleteView");
  const markView = document.getElementById("markSettingsView");
  const settingsMenu = document.getElementById("settingsMenu");

  if (mainView) mainView.style.display = (name === "main") ? "block" : "none";
  if (changeView) changeView.style.display = (name === "change") ? "block" : "none";
  if (deleteView) deleteView.style.display = (name === "delete") ? "block" : "none";
  if (markView) markView.style.display = (name === "marks") ? "block" : "none";
  if (settingsMenu) settingsMenu.style.display = "none";
}
function showMainView() {
  showView("main");
}
function showChangeView() {
  if (!currentUserId) {
    showLoginRequiredHint();
    return;
  }
  clearChangeViewInputs();
  showView("change");
  const input = document.getElementById("changeCurrentPasswordInput");
  if (input) input.focus();
}
function showDeleteView() {

    showLoginRequiredHint();
    return;
  }
  clearDeleteViewInputs();
  showView("delete");
  const input = document.getElementById("deleteCurrentPasswordInput");

}
function showMarkSettingsView() {

    showLoginRequiredHint();
    return;
  }
  renderMarkSettingsUI();
  showView("marks");
}

// ===== ローカルセッション操作 =====
function saveSessionToLocal() {
  try {
    if (!currentUserId || !currentPin) {
      localStorage.removeItem(SESSION_KEY);
      return;
    }
    const obj = { userId: currentUserId, pin: currentPin };
    localStorage.setItem(SESSION_KEY, JSON.stringify(obj));
  } catch (e) {
    console.warn("localStorage セッション保存でエラー", e);
  }
}

function clearSessionFromLocal() {
  try {
    localStorage.removeItem(SESSION_KEY);
  } catch (e) {
    console.warn("localStorage セッション削除でエラー", e);
  }
}

function tryAutoLoginFromLocal() {
  let raw;
  try {
    raw = localStorage.getItem(SESSION_KEY);
  } catch (e) {
    console.warn("localStorage 取得に失敗", e);
    return;
  }
  if (!raw) return;

  let info;
  try {
    info = JSON.parse(raw);
  } catch (e) {
    clearSessionFromLocal();
    return;
  }
  if (!info || !info.userId || !info.pin) {
    clearSessionFromLocal();
    return;
  }

  const userId = info.userId;
  const pin = info.pin;

  const docRef = db.collection("users").doc(userId);
  docRef.get().then((snap) => {
    if (!snap.exists) {
      clearSessionFromLocal();
      return;
    }
    const data = snap.data();
    if (!data.pin || data.pin !== pin) {
      clearSessionFromLocal();
      return;
    }

    currentUserId = userId;
    currentPin = data.pin;
    loginHintShown = false;
    loadUserStateFromData(data, docRef);
    updateLoginStatusUI();
    showMainView();
    renderCalendar();
    ensureExtraUI();
    renderLegendBar();
    setSelectedDate(null);
    updateSelectedInfo();
    updateMemoEditor();
  }).catch((e) => {
    console.error("自動ログインに失敗しました", e);
  });
}

// ===== ユーザー状態のロード =====
function loadUserStateFromData(data, docRef) {
  let needMigration = false;

  let dataMarks = data.marks || {};
  let defs = data.markDefinitions;
  let mainId = data.mainMarkId;
  let subs = data.subMarkIds || {};
  let memos = data.dayMemos || {};
  currentTheme = data.theme || "light";

  if (!defs) {
    const base = getDefaultMarkSetup();
    defs = base.defs;
    mainId = base.mainId;
    subs = base.subs;
    needMigration = true;
  }

  const legacyMap = { check: "m1", circle: "m2", double: "m3" };
  const newMarks = {};
  let converted = false;

  for (const dateKey of Object.keys(dataMarks)) {
    const val = dataMarks[dateKey];
    if (defs[val]) {
      newMarks[dateKey] = val;
    } else if (legacyMap[val]) {
      newMarks[dateKey] = legacyMap[val];
      converted = true;
    }
  }

  if (converted) needMigration = true;

  marks = newMarks;
  markDefinitions = defs;
  mainMarkId = mainId || null;
  subMarkIds = subs || {};
  dayMemos = memos || {};

  applyTheme();

  if (needMigration && docRef) {
    docRef.set(
      {
        marks,
        markDefinitions,
        mainMarkId,
        subMarkIds,
        theme: currentTheme,
        dayMemos
      },
      { merge: true }
    ).catch((e) => console.error("migration save error", e));
  }
}

// ===== 保存 =====
function saveUserStateToCloud() {
  if (!currentUserId || !currentPin) return;
  const docRef = db.collection("users").doc(currentUserId);

  docRef.set({
    pin: currentPin,
    marks,
    markDefinitions,
    mainMarkId,
    subMarkIds,
    theme: currentTheme,
    dayMemos
  }).catch((e) => console.error("saveUserStateToCloud error", e));
}

// ===== 新規登録 =====
async function registerUser(userId, pin) {
  if (!userId || !pin) {
    alert("ユーザーIDとパスワードを両方入力してね");
    return;
  }

  const docRef = db.collection("users").doc(userId);

  try {
    const snap = await docRef.get();
    if (snap.exists) {
      alert("そのユーザーIDは既に登録されています。別のIDを使ってください。");
      return;
    }

    const base = getDefaultMarkSetup();
    marks = {};
    markDefinitions = base.defs;
    mainMarkId = base.mainId;
    subMarkIds = base.subs;
    dayMemos = {};
    currentTheme = "light";

    await docRef.set({
      pin: pin,
      marks,
      markDefinitions,
      mainMarkId,
      subMarkIds,
      theme: currentTheme,
      dayMemos
    });

    currentUserId = userId;
    currentPin = pin;
    loginHintShown = false;
    applyTheme();
    saveSessionToLocal();
    updateLoginStatusUI();
    showMainView();
    renderCalendar();
    ensureExtraUI();
    renderLegendBar();
    setSelectedDate(null);
    updateSelectedInfo();
    updateMemoEditor();
    clearAccountInputs();

    showToast("新規登録が完了しました");
  } catch (e) {
    console.error(e);
    alert("新規登録でエラーが発生しました");
  }
}

// ===== ログイン =====
function loginUser(userId, pin) {
  if (!userId || !pin) {
    alert("ユーザーIDとパスワードを両方入力してね");
    return;
  }

  const docRef = db.collection("users").doc(userId);
  docRef.get().then((snap) => {
    if (!snap.exists) {
      alert("このユーザーIDは登録されていません");
      return;
    }
    const data = snap.data();
    if (!data.pin) {
      alert("このユーザーIDは古い形式のデータです。別のIDを使ってください。");
      return;
    }
    if (data.pin !== pin) {
      alert("パスワードが違います");
      return;
    }

    currentUserId = userId;
    currentPin = data.pin;
    loginHintShown = false;
    loadUserStateFromData(data, docRef);
    saveSessionToLocal();
    updateLoginStatusUI();
    showMainView();
    renderCalendar();
    ensureExtraUI();
    renderLegendBar();
    setSelectedDate(null);
    updateSelectedInfo();
    updateMemoEditor();
    clearAccountInputs();
    showToast("ログインに成功しました");
  }).catch((e) => {
    console.error(e);
    alert("ログインでエラーが発生しました");
  });
}

// ===== アカウント情報更新 =====
async function updateAccountInfo() {
  if (!currentUserId) {
    showLoginRequiredHint();
    return;
  }

  const currentPinInput = document.getElementById("changeCurrentPasswordInput");
  const newUserIdInput = document.getElementById("changeNewUserIdInput");
  const newPinInput = document.getElementById("changeNewPasswordInput");

  const currentPinValue = currentPinInput ? currentPinInput.value.trim() : "";
  const newUserIdRaw = newUserIdInput ? newUserIdInput.value.trim() : "";
  const newPinRaw = newPinInput ? newPinInput.value.trim() : "";

  if (!currentPinValue) {
    alert("現在のパスワードを入力してください");
    return;
  }
  if (currentPinValue !== currentPin) {
    alert("現在のパスワードが正しくありません");
    return;
  }
  if (!newUserIdRaw && !newPinRaw) {
    alert("変更したいユーザーIDまたはパスワードを入力してください");
    return;
  }

  let targetUserId = currentUserId;
  let targetPin = currentPin;

  if (newPinRaw) {
    targetPin = newPinRaw;
  }

  try {
    const usersCol = db.collection("users");

    if (newUserIdRaw && newUserIdRaw !== currentUserId) {
      const newDocRef = usersCol.doc(newUserIdRaw);
      const newSnap = await newDocRef.get();
      if (newSnap.exists) {
        alert("新しいユーザーIDは既に使われています");
        return;
      }

      await newDocRef.set({
        pin: targetPin,
        marks,
        markDefinitions,
        mainMarkId,
        subMarkIds,
        theme: currentTheme,
        dayMemos
      });

      await usersCol.doc(currentUserId).delete();

      targetUserId = newUserIdRaw;
    } else {
      await usersCol.doc(currentUserId).set(
        { pin: targetPin },
        { merge: true }
      );
    }

    currentUserId = targetUserId;
    currentPin = targetPin;
    loginHintShown = false;
    saveSessionToLocal();
    updateLoginStatusUI();
    clearAccountInputs();
    showMainView();
    renderCalendar();
    renderLegendBar();
    updateSelectedInfo();
    updateMemoEditor();
    showToast("アカウント情報を更新しました");
  } catch (e) {
    console.error(e);
    alert("アカウント更新時にエラーが発生しました");
  }
}

// ===== アカウント削除 =====
async function deleteAccount() {
  if (!currentUserId) {
    showLoginRequiredHint();
    return;
  }

  const currentPinInput = document.getElementById("deleteCurrentPasswordInput");
  const currentPinValue = currentPinInput ? currentPinInput.value.trim() : "";

  if (!currentPinValue) {

    return;
  }
  if (currentPinValue !== currentPin) {

  }

  const ok = confirm(

    "このユーザーIDのカレンダーデータはすべて消えます。"
  );
  if (!ok) return;

  try {
    await db.collection("users").doc(currentUserId).delete();

    marks = {};
    markDefinitions = {};
    mainMarkId = null;
    subMarkIds = {};
    dayMemos = {};
    currentUserId = null;
    currentPin = null;
    loginHintShown = false;
    selectedDateKey = null;
    clearSessionFromLocal();
    currentTheme = "light";
    currentMode = "mark";

    renderCalendar();
    renderLegendBar();
    updateSelectedInfo();

function updateLoginStatusUI() {

  const settingsMenu = document.getElementById("settingsMenu");
  const header = document.getElementById("loginHeaderText");
  const formBody = document.getElementById("loginFormBody");

// ===== マーク凡例の描画 =====
function renderLegendBar() {
  const legend = document.getElementById("legendBar");
  if (!legend) return;

  legend.innerHTML = "";

  if (!currentUserId) {
    legend.style.display = "none";
    return;
  }

  const items = [];

  if (mainMarkId && markDefinitions[mainMarkId]) {
    items.push({ id: mainMarkId, label: "メイン" });
  }

  const added = new Set(items.map(it => it.id));

  for (let i = 1; i <= 10; i++) {
    const sid = subMarkIds[String(i)];
    if (sid && markDefinitions[sid] && !added.has(sid)) {
      items.push({ id: sid, label: `サブ${i}` });
      added.add(sid);
    }
  }

  if (!items.length) {
    legend.style.display = "none";
    return;
  }

  legend.style.display = "flex";

  items.forEach(item => {
    const def = markDefinitions[item.id];
    const wrapper = document.createElement("div");
    wrapper.className = "legend-item";

    const iconSpan = document.createElement("span");
    iconSpan.className = "legend-icon";
    iconSpan.textContent = def.icon || "?";
    if (def.color) iconSpan.style.color = def.color;

    const labelSpan = document.createElement("span");
    labelSpan.textContent = item.label;

    wrapper.appendChild(iconSpan);
    wrapper.appendChild(labelSpan);
    legend.appendChild(wrapper);
  });
}

  const labelSpan = document.createElement("span");

// ===== 祝日判定（ベース） =====
function getBaseHolidayName(year, month, day) {
  // month: 0-11
  const m = month + 1;
  const key = `${m}-${day}`;
  const fixed = {
    "1-1": "元日",
    "2-11": "建国記念の日",
    "2-23": "天皇誕生日",
    "4-29": "昭和の日",
    "5-3": "憲法記念日",
    "5-4": "みどりの日",
    "5-5": "こどもの日",
    "8-11": "山の日",
    "11-3": "文化の日",
    "11-23": "勤労感謝の日"
  };
  if (fixed[key]) return fixed[key];

  function getNthWeekdayOfMonth(year, monthZero, weekday, nth) {
    let count = 0;
    for (let d = 1; d <= 31; d++) {
      const dt = new Date(year, monthZero, d);
      if (dt.getMonth() !== monthZero) break;
      if (dt.getDay() === weekday) {
        count++;
        if (count === nth) return d;
      }
    }
    return null;
  }

  // 成人の日: 1月第2月曜
  if (m === 1 && day === getNthWeekdayOfMonth(year, 0, 1, 2)) return "成人の日";
  // 海の日: 7月第3月曜
  if (m === 7 && day === getNthWeekdayOfMonth(year, 6, 1, 3)) return "海の日";
  // 敬老の日: 9月第3月曜
  if (m === 9 && day === getNthWeekdayOfMonth(year, 8, 1, 3)) return "敬老の日";
  // スポーツの日: 10月第2月曜
  if (m === 10 && day === getNthWeekdayOfMonth(year, 9, 1, 2)) return "スポーツの日";

  return "";
}

// ===== 祝日判定（振替休日込み） =====
function getHolidayName(year, month, day) {
  // month: 0-11
  const base = getBaseHolidayName(year, month, day);
  if (base) return base;

  const today = new Date(year, month, day);
  const dow = today.getDay();
  if (dow === 0) {
    // 日曜でベース祝日なし → 振替対象にはならない
    return "";
  }

  // 1日前が「日曜の祝日」だったら振替休日
  const prev = new Date(year, month, day - 1);
  const basePrev = getBaseHolidayName(prev.getFullYear(), prev.getMonth(), prev.getDate());
  if (basePrev && prev.getDay() === 0) {
    // 本来はここで「前日もすでに祝日だった場合のチェーン」等も見るが、
    // このアプリでは簡易的に1日分だけを見る。
    return "振替休日";
  }

  return "";
}

// ===== カレンダー描画 =====
function dateKey(year, month, day) {
  const m = (month + 1).toString().padStart(2, "0");
  const d = day.toString().padStart(2, "0");
  return `${year}-${m}-${d}`;
}

function renderCalendar() {
  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";

  const dowNames = ["日","月","火","水","木","金","土"];
  for (let i = 0; i < dowNames.length; i++) {
    const name = dowNames[i];
    const el = document.createElement("div");
    el.textContent = name;
    el.className = "dow";
    if (i === 0) el.classList.add("sun");
    else if (i === 6) el.classList.add("sat");
    grid.appendChild(el);
  }

  const firstDay = new Date(currentYear, currentMonth, 1);
  const firstDow = firstDay.getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

  for (let i = 0; i < firstDow; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    grid.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement("div");
    cell.className = "day";

    const num = document.createElement("div");
    num.className = "day-number";
    num.textContent = day;

    const holidayLabel = document.createElement("div");
    holidayLabel.className = "holiday-label";

    const icon = document.createElement("div");
    icon.className = "mark-icon";

    const memoIndicator = document.createElement("div");
    memoIndicator.className = "memo-indicator";

    cell.appendChild(num);
    cell.appendChild(holidayLabel);
    cell.appendChild(icon);
    cell.appendChild(memoIndicator);

    const key = dateKey(currentYear, currentMonth, day);
    cell.dataset.dateKey = key;

    const dow = (firstDow + (day - 1)) % 7;
    if (dow === 0) cell.classList.add("sun");
    else if (dow === 6) cell.classList.add("sat");

    // 祝日判定（振替休日込み）
    const holidayName = getHolidayName(currentYear, currentMonth, day);
    if (holidayName) {
      cell.classList.add("holiday");
      holidayLabel.textContent = holidayName;
    }

    if (key === todayKey) {
      cell.classList.add("today");
    }

    updateCellMark(cell, key);
    updateCellMemo(cell, key);
    attachPressHandlers(cell, key);
    grid.appendChild(cell);
  }

  // もし今選択中の日付がこの月にあればクラス付け直し
  if (selectedDateKey) {
    const selectedCell = document.querySelector(`.day[data-date-key="${selectedDateKey}"]`);
    if (selectedCell) {
      selectedCell.classList.add("selected");
    }
  }

  const monthLabel = document.getElementById("monthLabel");
  monthLabel.textContent = `${currentYear}年 ${currentMonth + 1}月`;

  // 「今日へ」ボタンの強調状態更新
  const now = new Date();
  const sameMonth =
    currentYear === now.getFullYear() && currentMonth === now.getMonth();
  const todayBtn = document.getElementById("todayBtn");
  if (todayBtn) {
    if (sameMonth) todayBtn.classList.remove("today-active");
    else todayBtn.classList.add("today-active");
  }
}

function updateCellMark(cell, key) {
  const iconEl = cell.querySelector(".mark-icon");
  iconEl.textContent = "";
  iconEl.style.color = "#111827";

  const markId = marks[key];
  if (!markId) {
    cell.classList.remove("has-mark");
    return;
  }
  const def = markDefinitions[markId];
  if (!def) {
    cell.classList.remove("has-mark");
    return;
  }

  cell.classList.add("has-mark");
  iconEl.textContent = def.icon || "";
  if (def.color) {
    iconEl.style.color = def.color;
  }
}

// メモインジケータ更新
function updateCellMemo(cell, key) {
  const memoEl = cell.querySelector(".memo-indicator");
  if (!memoEl) return;
  const txt = dayMemos[key];
  if (txt && txt.trim().length > 0) {
    memoEl.textContent = "📝";
    memoEl.style.display = "block";
  } else {
    memoEl.textContent = "";
    memoEl.style.display = "none";
  }
}

function toggleMainMarkOnDate(key) {
  if (!currentUserId) return;

  if (!mainMarkId || !markDefinitions[mainMarkId]) {
    alert("メインマークが設定されていません。設定画面から登録してください。");
    return;
  }

  const current = marks[key];
  if (current) {
    delete marks[key];
  } else {
    marks[key] = mainMarkId;
  }
  saveUserStateToCloud();
}

// ===== カレンダー切替アニメーション =====
function animateCalendar(direction) {
  const grid = document.getElementById("calendarGrid");
  if (!grid) return;
  grid.classList.remove("anim-left", "anim-right", "anim-fade");
  void grid.offsetWidth;
  if (direction === "left") {
    grid.classList.add("anim-left");
  } else if (direction === "right") {
    grid.classList.add("anim-right");
  } else {
    grid.classList.add("anim-fade");
  }
}

// ===== タップ / 長押し =====
function attachPressHandlers(cell, key) {
  let pressTimer = null;

  cell.addEventListener("pointerdown", (ev) => {
    if (cell.classList.contains("empty")) return;

    if (!currentUserId) {
      if (ev.pointerType === "mouse" || ev.pointerType === "touch" || ev.pointerType === "pen") {
        showLoginRequiredHint();
      }
      return;
    }

    // 右クリック
    if (ev.button === 2) {
      ev.preventDefault();
      setSelectedDate(key);
      if (currentMode === "mark") {
        openMarkMenuForCell(cell, key);
      }
      return;
    }

    // メモモードは長押しでマークメニューを出さない
    if (currentMode === "memo") {
      longPressTriggered = false;
      return;
    }

    // マークモードのみ長押し判定
    longPressTriggered = false;
    if (pressTimer) clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      longPressTriggered = true;
      setSelectedDate(key);
      openMarkMenuForCell(cell, key);
    }, LONG_PRESS_MS);
  });

  cell.addEventListener("pointerup", (ev) => {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
    if (!currentUserId || cell.classList.contains("empty")) return;
    if (ev.button === 2) return;

    // メモモード：マークは触らず、日付選択だけ
    if (currentMode === "memo") {
      setSelectedDate(key);
      return;
    }

    // マークモード：長押しでなければメインマークのON/OFF
    if (!longPressTriggered) {
      toggleMainMarkOnDate(key);
      updateCellMark(cell, key);
      setSelectedDate(key);
    }
  });

  cell.addEventListener("pointerleave", () => {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
  });

  cell.addEventListener("pointercancel", () => {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
  });

  cell.addEventListener("contextmenu", (ev) => {
    if (cell.classList.contains("empty")) return;
    ev.preventDefault();
    if (!currentUserId) {
      showLoginRequiredHint();
      return;
    }
    setSelectedDate(key);
    if (currentMode === "mark") {
      openMarkMenuForCell(cell, key);
    }
  });
}

const markMenu = document.getElementById("markMenu");

function buildMarkMenuItems() {
  markMenu.innerHTML = "";

  let hasSub = false;
  for (let i = 1; i <= 10; i++) {
    const id = subMarkIds[String(i)];
    if (!id) continue;
    const def = markDefinitions[id];
    if (!def) continue;
    hasSub = true;

    const btn = document.createElement("button");
    btn.dataset.markId = id;
    const iconSpan = document.createElement("span");
    iconSpan.className = "icon";
    iconSpan.textContent = def.icon || "?";
    if (def.color) iconSpan.style.color = def.color;
    const labelSpan = document.createElement("span");
    labelSpan.textContent = "サブ" + i;
    btn.appendChild(iconSpan);
    btn.appendChild(labelSpan);
    markMenu.appendChild(btn);
  }

  const clearBtn = document.createElement("button");
  clearBtn.dataset.markId = "none";
  const cIcon = document.createElement("span");
  cIcon.className = "icon";
  cIcon.textContent = "×";
  const cLabel = document.createElement("span");
  cLabel.textContent = "マークを消す";
  clearBtn.appendChild(cIcon);
  clearBtn.appendChild(cLabel);
  markMenu.appendChild(clearBtn);

  if (!hasSub) {
    const info = document.createElement("div");
    info.style.fontSize = "0.75rem";
    info.style.color = "#6b7280";
    info.style.marginTop = "4px";
    info.textContent = "※サブマークは設定画面から登録できます。";
    markMenu.appendChild(info);
  }
}

function openMarkMenuForCell(cell, key) {
  // メモモード中はマークメニューを出さない
  if (currentMode !== "mark") return;

  if (!currentUserId) {
    showLoginRequiredHint();
    return;
  }
  buildMarkMenuItems();
  const rect = cell.getBoundingClientRect();
  markMenu.style.display = "flex";
  let left = rect.left + window.scrollX;
  let top = rect.bottom + window.scrollY + 4;
  const menuWidth = 180;
  if (left + menuWidth > window.scrollX + window.innerWidth) {
    left = window.scrollX + window.innerWidth - menuWidth - 8;
  }
  markMenu.style.left = left + "px";
  markMenu.style.top = top + "px";
  markMenu.dataset.dateKey = key;
}

function closeMarkMenu() {
  markMenu.style.display = "none";
  delete markMenu.dataset.dateKey;
}

markMenu.addEventListener("click", (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  const markId = btn.dataset.markId;
  const key = markMenu.dataset.dateKey;
  if (!key || !currentUserId) return;

  if (markId === "none") {
    delete marks[key];
  } else if (markDefinitions[markId]) {
    marks[key] = markId;
  }
  saveUserStateToCloud();
  const cell = document.querySelector(`.day[data-date-key="${key}"]`);
  if (cell) updateCellMark(cell, key);
  closeMarkMenu();
  setSelectedDate(key);
});

document.addEventListener("click", (ev) => {
  if (markMenu.style.display === "flex") {
    const inside = ev.target.closest("#markMenu");
    if (!inside) closeMarkMenu();
  }
});

// ===== 年月ピッカー & ナビ =====
const MIN_YEAR = 2000;
const MAX_YEAR = 2100;

function openMonthPicker() {
  const overlay = document.getElementById("monthPickerOverlay");
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");

  if (!yearSelect.dataset.initialized) {
    for (let y = MIN_YEAR; y <= MAX_YEAR; y++) {
      const opt = document.createElement("option");
      opt.value = String(y);
      opt.textContent = `${y}年`;
      yearSelect.appendChild(opt);
    }
    yearSelect.dataset.initialized = "1";
  }

  yearSelect.value = String(currentYear);
  monthSelect.value = String(currentMonth + 1);
  overlay.style.display = "flex";
}

function closeMonthPicker() {
  document.getElementById("monthPickerOverlay").style.display = "none";
}

document.getElementById("monthLabel").addEventListener("click", openMonthPicker);
document.getElementById("monthPickerCancel").addEventListener("click", closeMonthPicker);
document.getElementById("monthPickerOK").addEventListener("click", () => {
  const year = parseInt(document.getElementById("yearSelect").value, 10);
  const month = parseInt(document.getElementById("monthSelect").value, 10) - 1;
  if (!isNaN(year) && !isNaN(month)) {
    currentYear = year;
    currentMonth = month;
    renderCalendar();
    animateCalendar("fade");
  }
  closeMonthPicker();
});

document.getElementById("monthPickerOverlay").addEventListener("click", (ev) => {
  if (ev.target.id === "monthPickerOverlay") closeMonthPicker();
});

document.getElementById("prevMonth").addEventListener("click", () => {
  currentMonth--;
  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }
  renderCalendar();
  animateCalendar("left");
});

document.getElementById("nextMonth").addEventListener("click", () => {
  currentMonth++;
  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }
  renderCalendar();
  animateCalendar("right");
});

const todayBtnEl = document.getElementById("todayBtn");
if (todayBtnEl) {
  todayBtnEl.addEventListener("click", () => {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    renderCalendar();
    animateCalendar("fade");

    if (currentUserId) {
      const key = dateKey(now.getFullYear(), now.getMonth(), now.getDate());
      setSelectedDate(key);
    } else {
      setSelectedDate(null);
    }
  });
}

// ===== マーク設定画面のUI =====
function generateMarkId() {
  return "m" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
}

function applyColorToSelect(selectEl) {
  const val = selectEl.value;
  if (val && markDefinitions[val]) {
    const def = markDefinitions[val];
    const color = def.color || "#111827";
    selectEl.style.color = color;
  } else {
    selectEl.style.color = "#111827";
  }
}

function updateAllMarkSelectColors() {
  const mainSelect = document.getElementById("mainMarkSelect");
  if (mainSelect) applyColorToSelect(mainSelect);
  for (let i = 1; i <= 10; i++) {
    const sel = document.getElementById("subMarkSelect" + i);
    if (sel) applyColorToSelect(sel);
  }
}

// selectedState: { main: string, subs: { "1": string, ... } } 省略可
function renderMarkSettingsUI(selectedState) {
  const mainSelect = document.getElementById("mainMarkSelect");
  const unusedList = document.getElementById("unusedMarksList");
  const themeSelect = document.getElementById("themeSelect");

  if (themeSelect) {
    themeSelect.value = currentTheme || "light";
  }

  const allIds = Object.keys(markDefinitions);

  // メイン選択肢
  mainSelect.innerHTML = "";
  const ph = document.createElement("option");
  ph.value = "";
  ph.textContent = "選択してください";
  mainSelect.appendChild(ph);

  allIds.forEach((id) => {
    const def = markDefinitions[id];
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = def.icon || "?";
    if (def.color) {
      opt.style.color = def.color;
    }
    mainSelect.appendChild(opt);
  });

  const desiredMain = selectedState && selectedState.main;
  if (desiredMain && markDefinitions[desiredMain]) {
    mainSelect.value = desiredMain;
  } else if (mainMarkId && markDefinitions[mainMarkId]) {
    mainSelect.value = mainMarkId;
  }

  // サブ選択肢
  for (let i = 1; i <= 10; i++) {
    const sel = document.getElementById("subMarkSelect" + i);
    if (!sel) continue;
    sel.innerHTML = "";
    const noneOpt = document.createElement("option");
    noneOpt.value = "";
    noneOpt.textContent = "未設定";
    sel.appendChild(noneOpt);

    allIds.forEach((id) => {
      const def = markDefinitions[id];
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = def.icon || "?";
      if (def.color) {
        opt.style.color = def.color;
      }
      sel.appendChild(opt);
    });

    const desiredSub =
      selectedState &&
      selectedState.subs &&
      selectedState.subs[String(i)];
    const currentId = subMarkIds[String(i)];

    if (desiredSub && markDefinitions[desiredSub]) {
      sel.value = desiredSub;
    } else if (currentId && markDefinitions[currentId]) {
      sel.value = currentId;
    }
  }

  // マーク一覧
  unusedList.innerHTML = "";
  if (allIds.length === 0) {
    const msg = document.createElement("span");
    msg.textContent = "マークがまだありません。先にマークを追加してください。";
    msg.style.fontSize = "0.8rem";
    msg.style.color = "#6b7280";
    unusedList.appendChild(msg);
  } else {
    allIds.forEach((id) => {
      const def = markDefinitions[id];

      const label = document.createElement("label");
      label.className = "unused-mark-item";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.dataset.markId = id;

      const iconSpan = document.createElement("span");
      iconSpan.className = "unused-mark-icon";
      iconSpan.textContent = def.icon || "?";
      if (def.color) {
        iconSpan.style.color = def.color;
      }

      label.appendChild(checkbox);
      label.appendChild(iconSpan);
      unusedList.appendChild(label);
    });
  }

  updateAllMarkSelectColors();
}

// ===== ログインUI & 設定UIセットアップ =====
function setupLoginUI() {
  const userIdInput = document.getElementById("userIdInput");
  const pinInput = document.getElementById("pinInput");
  const registerBtn = document.getElementById("registerBtn");
  const loginBtn = document.getElementById("loginBtn");
  const settingsBtn = document.getElementById("settingsBtn");
  const settingsMenu = document.getElementById("settingsMenu");
  const loginToggleBtn = document.getElementById("loginToggleBtn");

  const changeSaveBtn = document.getElementById("changeSaveBtn");
  const changeBackBtn = document.getElementById("changeBackBtn");
  const deleteExecuteBtn = document.getElementById("deleteExecuteBtn");
  const deleteBackBtn = document.getElementById("deleteBackBtn");

  const addMarkBtn = document.getElementById("addMarkBtn");
  const markSaveBtn = document.getElementById("markSaveBtn");
  const deleteMarksBtn = document.getElementById("deleteMarksBtn");
  const markBackBtn = document.getElementById("markBackBtn");

  const themeSelect = document.getElementById("themeSelect");

  if (loginToggleBtn) {
    loginToggleBtn.addEventListener("click", () => {
      const formBody = document.getElementById("loginFormBody");
      if (!formBody) return;
      const isHidden = formBody.style.display === "none";
      formBody.style.display = isHidden ? "block" : "none";
      loginToggleBtn.textContent = isHidden ? "▲" : "▼";
    });
  }

  registerBtn.addEventListener("click", () => {
    const userId = userIdInput.value.trim();
    const pin = pinInput.value.trim();
    registerUser(userId, pin);
  });

  loginBtn.addEventListener("click", () => {
    const userId = userIdInput.value.trim();
    const pin = pinInput.value.trim();
    loginUser(userId, pin);
  });

  if (settingsBtn && settingsMenu) {
    settingsBtn.addEventListener("click", (ev) => {
      if (!currentUserId) {
        showLoginRequiredHint();
        return;
      }
      ev.stopPropagation();
      const isOpen = settingsMenu.style.display === "block";
      settingsMenu.style.display = isOpen ? "none" : "block";
    });

    settingsMenu.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button");
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === "openChange") {
        showChangeView();
      } else if (action === "openDelete") {
        showDeleteView();
      } else if (action === "logout") {
        logoutUser();
      } else if (action === "openMarks") {
        showMarkSettingsView();
      }
    });

    document.addEventListener("click", (ev) => {
      const withinBtn = ev.target.closest("#settingsBtn");
      const withinMenu = ev.target.closest("#settingsMenu");
      if (!withinBtn && !withinMenu) {
        settingsMenu.style.display = "none";
      }
    });
  }

  if (changeSaveBtn) {
    changeSaveBtn.addEventListener("click", () => {
      updateAccountInfo();
    });
  }
  if (changeBackBtn) {
    changeBackBtn.addEventListener("click", () => {
      showMainView();
    });
  }
  if (deleteExecuteBtn) {
    deleteExecuteBtn.addEventListener("click", () => {
      deleteAccount();
    });
  }
  if (deleteBackBtn) {
    deleteBackBtn.addEventListener("click", () => {
      showMainView();
    });
  }

  if (themeSelect) {
    themeSelect.addEventListener("change", () => {
      currentTheme = themeSelect.value || "light";
      applyTheme();
      saveUserStateToCloud();
    });
  }

  if (addMarkBtn) {
    addMarkBtn.addEventListener("click", () => {
      const iconInput = document.getElementById("newMarkIconInput");
      const colorInput = document.getElementById("newMarkColorInput");
      const icon = iconInput.value.trim();
      const color = colorInput.value || "#111827";

      if (!icon) {
        alert("表示する記号・絵文字を入力してください");
        return;
      }

      // 同じ見た目（icon + color）の重複チェック
      for (const def of Object.values(markDefinitions)) {
        if (def.icon === icon && (def.color || "#111827") === color) {
          alert("同じ見た目のマークが既に存在します。");
          return;
        }
      }

      // 現在のメイン/サブ選択状態を保持してから再描画
      const selectedState = { main: "", subs: {} };
      const mainSel = document.getElementById("mainMarkSelect");
      if (mainSel) selectedState.main = mainSel.value || "";
      for (let i = 1; i <= 10; i++) {
        const sel = document.getElementById("subMarkSelect" + i);
        if (sel) {
          selectedState.subs[String(i)] = sel.value || "";
        }
      }

      const id = generateMarkId();
      markDefinitions[id] = { icon, color };
      iconInput.value = "";
      renderMarkSettingsUI(selectedState);
      renderLegendBar();
    });
  }

  if (markSaveBtn) {
    markSaveBtn.addEventListener("click", () => {
      const mainSelect = document.getElementById("mainMarkSelect");
      const newMainId = mainSelect.value;
      if (!newMainId) {
        alert("メインを登録してください");
        return;
      }
      if (!markDefinitions[newMainId]) {
        alert("選択されたメインマークが無効です");
        return;
      }

      const newSubs = {};
      const usedIds = [];
      usedIds.push(newMainId);

      for (let i = 1; i <= 10; i++) {
        const sel = document.getElementById("subMarkSelect" + i);
        if (!sel) continue;
        const val = sel.value;
        if (val && markDefinitions[val]) {
          newSubs[String(i)] = val;
          usedIds.push(val);
        }
      }

      const idSet = new Set(usedIds);
      if (idSet.size !== usedIds.length) {
        alert("メインやサブに同じマークを複数登録することはできません。");
        return;
      }

      mainMarkId = newMainId;
      subMarkIds = newSubs;
      saveUserStateToCloud();
      showMainView();
      renderCalendar();
      renderLegendBar();
      updateSelectedInfo();
      updateMemoEditor();
      showToast("マーク設定を保存しました");
    });
  }

  if (deleteMarksBtn) {
    deleteMarksBtn.addEventListener("click", () => {
      const list = document.getElementById("unusedMarksList");
      if (!list) return;

      const checked = list.querySelectorAll('input[type="checkbox"][data-mark-id]:checked');
      if (!checked.length) {
        alert("削除したいマークにチェックを入れてください");
        return;
      }

      const idsToDelete = Array.from(checked).map((cb) => cb.dataset.markId);
      const idsSet = new Set(idsToDelete);

      let affectedCalendarCount = 0;
      for (const key in marks) {
        if (idsSet.has(marks[key])) {
          affectedCalendarCount++;
        }
      }

      let affectsMainOrSub = false;
      if (mainMarkId && idsSet.has(mainMarkId)) {
        affectsMainOrSub = true;
      }
      for (let i = 1; i <= 10; i++) {
        const sid = subMarkIds[String(i)];
        if (sid && idsSet.has(sid)) {
          affectsMainOrSub = true;
          break;
        }
      }

      let msg = "選択したマークを削除します。";
      if (affectedCalendarCount > 0) {
        msg += `\n\n※カレンダー上でこれらのマークが使われている日（${affectedCalendarCount} 日分）は空白に戻ります。`;
      }
      if (affectsMainOrSub) {
        msg += "\n※メイン / サブに使われているマークは「未設定」に戻ります。";
      }
      if (!confirm(msg)) return;

      // カレンダー上のマークを空欄へ
      for (const key in marks) {
        if (idsSet.has(marks[key])) {
          delete marks[key];
        }
      }

      // メイン / サブで使っている場合は未設定に戻す
      if (mainMarkId && idsSet.has(mainMarkId)) {
        mainMarkId = null;
      }
      for (let i = 1; i <= 10; i++) {
        const sid = subMarkIds[String(i)];
        if (sid && idsSet.has(sid)) {
          delete subMarkIds[String(i)];
        }
      }

      // 定義自体を削除
      idsToDelete.forEach((id) => {
        delete markDefinitions[id];
      });

      saveUserStateToCloud();
      renderMarkSettingsUI();
      renderCalendar();
      renderLegendBar();
      updateSelectedInfo();
      updateMemoEditor();
    });
  }

  if (markBackBtn) {
    markBackBtn.addEventListener("click", () => {
      showMainView();
    });
  }

  const markSettingsView = document.getElementById("markSettingsView");
  if (markSettingsView) {
    markSettingsView.addEventListener("change", (ev) => {
      if (
        ev.target.tagName === "SELECT" &&
        (ev.target.id.startsWith("subMarkSelect") || ev.target.id === "mainMarkSelect")
      ) {
        applyColorToSelect(ev.target);
      }
    });
  }
}

// ===== モード切り替えUIセットアップ =====
function setupModeUI() {
  const markBtn = document.getElementById("modeMarkBtn");
  const memoBtn = document.getElementById("modeMemoBtn");
  if (!markBtn || !memoBtn) return;

  markBtn.addEventListener("click", () => {
    currentMode = "mark";
    updateModeUI();
    showToast("マークモードに切り替えました");
  });

  memoBtn.addEventListener("click", () => {
    currentMode = "memo";
    updateModeUI();
    showToast("メモモードに切り替えました");
  });

  updateModeUI();
}

// ===== メモUIセットアップ =====
function setupMemoUI() {
  if (memoUIInitialized) return;

  const textarea = document.getElementById("memoTextarea");
  const saveBtn = document.getElementById("memoSaveBtn");
  const clearBtn = document.getElementById("memoClearBtn");

  if (!textarea || !saveBtn || !clearBtn) return;

  saveBtn.addEventListener("click", () => {
    if (!currentUserId || !selectedDateKey) {
      showLoginRequiredHint();
      return;
    }
    const txt = textarea.value;
    if (txt && txt.trim().length > 0) {
      dayMemos[selectedDateKey] = txt;
    } else {
      delete dayMemos[selectedDateKey];
    }
    saveUserStateToCloud();
    const cell = document.querySelector(`.day[data-date-key="${selectedDateKey}"]`);
    if (cell) updateCellMemo(cell, selectedDateKey);
    updateSelectedInfo();
    showToast("メモを保存しました");
  });

  clearBtn.addEventListener("click", () => {
    if (!currentUserId || !selectedDateKey) {
      showLoginRequiredHint();
      return;
    }
    if (!dayMemos[selectedDateKey]) {
      textarea.value = "";
      showToast("そもそもメモがありません");
      return;
    }
    const ok = confirm("この日のメモを削除しますか？");
    if (!ok) return;
    delete dayMemos[selectedDateKey];
    textarea.value = "";
    saveUserStateToCloud();
    const cell = document.querySelector(`.day[data-date-key="${selectedDateKey}"]`);
    if (cell) updateCellMemo(cell, selectedDateKey);
    updateSelectedInfo();
    showToast("メモを削除しました");
  });

  memoUIInitialized = true;
}

// ===== 初期化 =====
function init() {
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();
  loginHintShown = false;
  currentTheme = "light";
  currentMode = "mark";
  applyTheme();

  setupLoginUI();
  setupModeUI();
  showMainView();
  renderCalendar();
  ensureExtraUI();
  renderLegendBar();
  updateLoginStatusUI();
  updateSelectedInfo();
  updateMemoEditor();

  tryAutoLoginFromLocal();
}

document.addEventListener("DOMContentLoaded", init);
